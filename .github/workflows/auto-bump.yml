name: auto-bump

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync formulas with latest release
        run: python3 scripts/bump.py
      - name: Commit & push
        run: |
          git config user.name "tap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nic nowego" || {
            git commit -m "bump: formulas synced with latest release $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
          }
